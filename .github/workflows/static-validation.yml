name: Static preservation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit whitespace
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi
      - name: Required preservation documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md NOTICE.md THIRD_PARTY.md BUILDING.md RUNNING_QEMU.md TESTING.md RESTORE.md; do
            test -s "$file"
          done
          test -s docs/TRANCHE_201_RELEASE_NOTES.md
          test -s docs/TRANCHE_201_EVIDENCE.md
          test -s docs/evidence/tranche-201/kernel.sha256
      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Reject generated or oversized tracked files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'build/**' 'third_party/**' '*.o' '*.elf' '*.img' '*.dtb')"
          test -z "$(find . -path ./.git -prune -o -type f -size +50M -print -quit)"
